name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 建立 release 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 版本號以 tag 為準（v1.2.3 -> 1.2.3），不必為了發版去改 build.gradle.kts
      - name: Resolve version from tag
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # 測試不過就不發版
      - name: Test
        run: ./gradlew --no-daemon test

      - name: Build shadow jar
        run: ./gradlew --no-daemon shadowJar -PappVersion="$APP_VERSION"

      - name: Checksum
        working-directory: build/libs
        run: sha256sum burp-es-logger.jar | tee burp-es-logger.jar.sha256

      # 用 runner 內建的 gh CLI，不引入第三方 action，供應鏈面積小一點
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/libs/burp-es-logger.jar \
            build/libs/burp-es-logger.jar.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
