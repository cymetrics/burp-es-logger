version: 2
updates:
  # 只收 minor / patch。大版本（Kotlin plugin、action 主版號）會改行為或相容性，
  # 自動開的 PR 一律 CI 失敗，手動評估比較省事。
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
